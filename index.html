<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/favicon-32x32.png">
    <title>Planejamento Pessoal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-layout">
    
    <aside class="sidebar">
      <h1 class="sidebar-title">Links</h1>
      
      <div class="links-group">
        <a href="https://drive.google.com" target="_blank" class="link-btn">Drive</a>
        <a href="https://trello.com" target="_blank" class="link-btn">Trello</a>
        <a href="https://chatgpt.com" target="_blank" class="link-btn">ChatGPT</a>
        <a href="https://www.canva.com/projects" target="_blank" class="link-btn">Canva</a>
      </div>
    </aside>

    <main class="task-section">
      <div class="container">
        <h1 class="task-title">Lista de Tarefas</h1>

        <div class="add">
          <input id="taskInput" type="text" placeholder="O que preciso fazer hoje?">
          <input id="taskDate" type="date" title="Data de entrega">
          <button onclick="addTask()">Adicionar</button>
        </div>

        <div class="lists-container">
          <div class="list-column">
            <h2>A fazer</h2>
            <ul id="todo"></ul>
          </div>

          <div class="list-column">
            <h2>Concluídos</h2>
            <ul id="done"></ul>
          </div>
        </div>
      </div>
    </main>

  </div>

  <div id="descModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h2>Descrição da Atividade</h2>
      <textarea id="taskDesc" rows="6" placeholder="Escreva os detalhes da sua tarefa aqui..."></textarea>
      <button class="save-modal-btn" onclick="saveDescription()">Salvar Descrição</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
